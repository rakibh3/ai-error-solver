name: CI/CD Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]
    types: [ closed ]

env:
  DOCKER_IMAGE: bayajid23/ai-error-solver-backend
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_IMAGE }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy to EC2
      run: |
        # Get the image tag that was just built
        IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
        
        # SSH into EC2 and deploy
        echo "${{ secrets.EC2_SSH_KEY }}" > ec2-key.pem
        chmod 600 ec2-key.pem
        
        ssh -o StrictHostKeyChecking=no -i ec2-key.pem ubuntu@${{ secrets.EC2_PUBLIC_IP }} << EOF
          # Pull the latest image
          docker pull $IMAGE_TAG
          
          # Stop existing container
          docker stop ai-error-solver || true
          docker rm ai-error-solver || true
          
          # Run new container
          docker run -d \
            --name ai-error-solver \
            --restart unless-stopped \
            -p 8000:8000 \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            -e VOYAGE_API_KEY="${{ secrets.VOYAGE_API_KEY }}" \
            -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            -e QDRANT_HOST="${{ secrets.QDRANT_HOST }}" \
            -e QDRANT_PORT="${{ secrets.QDRANT_PORT }}" \
            -e QDRANT_API_KEY="${{ secrets.QDRANT_API_KEY }}" \
            $IMAGE_TAG
          
          # Clean up old images
          docker image prune -f
        EOF
        
        rm ec2-key.pem
